[package]
name = "x-recipe-bench"
description = "X Recipe Bench: develop Fujifilm RAF files through the camera's own engine."
version.workspace = true
edition.workspace = true

[dependencies]
xrp-camera = { path = "../camera" }
xrp-recipes = { path = "../recipes" }
trash = "5"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reading the mouse button while the system drags a window (see pointer.rs).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
