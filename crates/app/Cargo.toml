[package]
name = "x-recipe-bench"
description = "X Recipe Bench: develop Fujifilm RAF files through the camera's own engine."
version.workspace = true
edition.workspace = true

[dependencies]
xrp-camera = { path = "../camera" }
xrp-recipes = { path = "../recipes" }
trash = "5"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
# Pictures in memory, turning, cropping and resizing. JPEG reading and writing is craft-jpeg's.
image = { version = "0.25", default-features = false, features = ["png"] }
craft-jpeg.workspace = true
craft-develop.workspace = true
craft-metadata.workspace = true
craft-atomic.workspace = true
craft-settings.workspace = true
craft-dialogs.workspace = true
craft-ui = { workspace = true, features = ["system_fonts"] }
craft-window = { workspace = true, features = ["egui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reading the mouse button while the system drags a window (see pointer.rs).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
